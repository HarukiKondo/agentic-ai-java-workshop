name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Dependabot PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge Dependabot PR
        # When several Dependabot PRs land at once (e.g. a grouped quarkus-platform
        # bump across every module), each merge advances `main` and the others fail
        # with "Base branch was modified. Review and try the merge again."
        # This repo has no branch protection, so `--auto` can't be used: it errors
        # with "Protected branch rules not configured for this branch". Instead merge
        # directly and retry with jittered backoff to ride out the base-branch race.
        run: |
          for attempt in $(seq 1 6); do
            if gh pr merge --squash "$PR_URL"; then
              echo "Merge succeeded on attempt $attempt"
              exit 0
            fi
            sleep_for=$(( (RANDOM % 15) + 15 ))
            echo "Attempt $attempt failed (base branch likely moved); retrying in ${sleep_for}s..."
            sleep "$sleep_for"
          done
          echo "Retries exhausted; attempting a final direct squash merge..."
          gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
